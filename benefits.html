<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Benefit Payments</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3248;
    --text: #e8eaf0;
    --muted: #7c82a0;
    --pip: #6ea8fe;
    --esa: #79dbb0;
    --uc:  #f0a060;
    --soon: #f06060;
    --today-col: #a78bfa;
    --radius: 16px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.02em; }
  .today-line { font-size: 0.82rem; color: var(--muted); margin-bottom: 32px; }

  .cards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
  }
  .card.pip::before { background: var(--pip); }
  .card.esa::before { background: var(--esa); }
  .card.uc::before  { background: var(--uc);  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .tag {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 99px;
  }
  .pip .tag { background: rgba(110,168,254,0.15); color: var(--pip); }
  .esa .tag { background: rgba(121,219,176,0.15); color: var(--esa); }
  .uc  .tag { background: rgba(240,160,96,0.15);  color: var(--uc);  }

  .freq-label { font-size: 0.75rem; color: var(--muted); }

  .amount {
    font-family: 'DM Mono', monospace;
    font-size: 1.05rem;
    font-weight: 500;
    margin-bottom: 10px;
    opacity: 0.85;
  }
  .pip .amount { color: var(--pip); }
  .esa .amount { color: var(--esa); }
  .uc  .amount { color: var(--uc);  }

  .next-date {
    font-family: 'DM Mono', monospace;
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .days-pill {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 6px;
  }
  .days-pill.far    { background: rgba(121,219,176,0.12); color: var(--esa); }
  .days-pill.medium { background: rgba(240,160,96,0.12);  color: var(--uc);  }
  .days-pill.soon   { background: rgba(240,96,96,0.15);   color: var(--soon);}
  .days-pill.today  { background: rgba(167,139,250,0.2);  color: var(--today-col); }

  .weekend-note { font-size: 0.75rem; color: var(--muted); font-style: italic; margin-top: 4px; }

  .section-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .backup-row { display: flex; gap: 10px; }
  .backup-btn {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .backup-btn:hover { border-color: var(--muted); }
  #load-input { display: none; }

  .refresh-note { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 28px; }
</style>
</head>
<body>

<h1>My Benefit Payments</h1>
<p class="today-line" id="today-line"></p>
<div class="cards" id="cards"></div>

<p class="section-title">Backup &amp; Restore</p>
<div class="backup-row">
  <button class="backup-btn" onclick="saveBackup()">💾 Save Backup</button>
  <button class="backup-btn" onclick="document.getElementById('load-input').click()">📂 Load Backup</button>
</div>
<input type="file" id="load-input" accept=".json" onchange="loadBackup(event)">
<p class="refresh-note">Dates recalculate automatically every time you open this page.</p>

<script>
// ── Payment schedules (verified by calculation, not guesswork) ──────
const SCHEDULES = [
  {
    id:       'pip',
    label:    'PIP',
    freq:     'Every 4 weeks',
    amount:   '£626.80',
    type:     'interval',
    anchor:   [2025, 6, 18],   // 18 June 2025 (months are 1-based here)
    days:     28,
  },
  {
    id:       'esa',
    label:    'ESA',
    freq:     'Every 2 weeks',
    amount:   '£291.80',
    type:     'interval',
    anchor:   [2025, 6, 3],    // 3 June 2025 (verified anchor)
    days:     14,
  },
  {
    id:       'uc',
    label:    'UC',
    freq:     'Monthly on the 12th',
    amount:   '£649.97',
    type:     'monthly',
    dayOfMonth: 12,
  },
];

// ── Helpers ────────────────────────────────────────────────────────

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// anchor: [year, month_1based, day]
function anchorToDate(a) {
  return new Date(a[0], a[1] - 1, a[2]);
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function nextInterval(anchor, intervalDays) {
  const today = startOfToday();
  let d = new Date(anchor);
  d.setHours(0, 0, 0, 0);
  while (d <= today) {
    d = addDays(d, intervalDays);
  }
  return d;
}

function nextMonthly(dayOfMonth) {
  const today = startOfToday();
  const y = today.getFullYear();
  const m = today.getMonth(); // 0-based
  let candidate = new Date(y, m, dayOfMonth);
  if (candidate <= today) {
    candidate = new Date(y, m + 1, dayOfMonth);
  }
  return candidate;
}

// Move Saturday/Sunday back to Friday
function adjustWeekend(d) {
  const dow = d.getDay(); // 0=Sun, 6=Sat
  if (dow === 6) return { date: addDays(d, -1), note: 'The 12th is a Saturday — paid Friday instead' };
  if (dow === 0) return { date: addDays(d, -2), note: 'The 12th is a Sunday — paid Friday instead' };
  return { date: d, note: null };
}

function calcNext(s) {
  let raw;
  if (s.type === 'interval') {
    raw = nextInterval(anchorToDate(s.anchor), s.days);
    // Intervals: weekend shift just shows note, no anchor change needed
    const dow = raw.getDay();
    if (dow === 6) return { date: addDays(raw, -1), note: 'Falls on Saturday — paid Friday instead' };
    if (dow === 0) return { date: addDays(raw, -2), note: 'Falls on Sunday — paid Friday instead' };
    return { date: raw, note: null };
  } else {
    raw = nextMonthly(s.dayOfMonth);
    return adjustWeekend(raw);
  }
}

function fmt(d) {
  return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}

function daysUntil(d) {
  return Math.round((d - startOfToday()) / 86_400_000);
}

// ── Render ────────────────────────────────────────────────────────

function render() {
  const now = new Date();
  document.getElementById('today-line').textContent =
    'Today is ' + now.toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

  const container = document.getElementById('cards');
  container.innerHTML = '';

  SCHEDULES.forEach(s => {
    const { date, note } = calcNext(s);
    const days = daysUntil(date);

    let pillClass, pillText;
    if (days === 0)       { pillClass = 'today';  pillText = '🎉 Today!'; }
    else if (days === 1)  { pillClass = 'soon';   pillText = 'Tomorrow'; }
    else if (days <= 5)   { pillClass = 'soon';   pillText = `In ${days} days`; }
    else if (days <= 12)  { pillClass = 'medium'; pillText = `In ${days} days`; }
    else                  { pillClass = 'far';    pillText = `In ${days} days`; }

    const noteHTML = note
      ? `<div class="weekend-note">⚠️ ${note}</div>`
      : '';

    const card = document.createElement('div');
    card.className = `card ${s.id}`;
    card.innerHTML = `
      <div class="card-header">
        <span class="tag">${s.label}</span>
        <span class="freq-label">${s.freq}</span>
      </div>
      <div class="amount">${s.amount}</div>
      <div class="next-date">${fmt(date)}</div>
      <span class="days-pill ${pillClass}">${pillText}</span>
      ${noteHTML}
    `;
    container.appendChild(card);
  });
}

// ── Backup / Restore ──────────────────────────────────────────────

function saveBackup() {
  const payload = {
    note: 'Benefits tracker backup — keep this file safe',
    saved: new Date().toISOString(),
    schedules: SCHEDULES,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'benefits-backup.json';
  a.click();
}

function loadBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      JSON.parse(ev.target.result);
      alert('Backup file is valid and intact. Your dates are baked into the page itself, so your tracker is already working correctly.');
    } catch {
      alert('Could not read that file. Make sure it is a valid backup.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

render();
</script>
</body>
</html>
