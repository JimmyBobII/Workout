<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Benefit Payments</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3248;
    --text: #e8eaf0;
    --muted: #7c82a0;
    --pip: #6ea8fe;
    --esa: #79dbb0;
    --uc:  #f0a060;
    --soon: #f06060;
    --radius: 16px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }

  .today-line {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 32px;
  }

  /* ── Cards ── */
  .cards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
  }
  .card.pip::before { background: var(--pip); }
  .card.esa::before { background: var(--esa); }
  .card.uc::before  { background: var(--uc);  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .tag {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 99px;
  }
  .pip .tag { background: rgba(110,168,254,0.15); color: var(--pip); }
  .esa .tag { background: rgba(121,219,176,0.15); color: var(--esa); }
  .uc  .tag { background: rgba(240,160,96,0.15);  color: var(--uc);  }

  .freq-label {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .next-date {
    font-family: 'DM Mono', monospace;
    font-size: 1.45rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .days-pill {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 6px;
  }
  .days-pill.far    { background: rgba(121,219,176,0.12); color: var(--esa); }
  .days-pill.medium { background: rgba(240,160,96,0.12);  color: var(--uc);  }
  .days-pill.soon   { background: rgba(240,96,96,0.15);   color: var(--soon);}
  .days-pill.today  { background: rgba(110,168,254,0.15); color: var(--pip); }

  .weekend-note {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
    margin-top: 4px;
  }

  /* ── Backup ── */
  .section-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .backup-row { display: flex; gap: 10px; }

  .backup-btn {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .backup-btn:hover { border-color: var(--muted); }

  #load-input { display: none; }

  .refresh-note {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 28px;
  }
</style>
</head>
<body>

<h1>My Benefit Payments</h1>
<p class="today-line" id="today-line"></p>

<div class="cards" id="cards"></div>

<p class="section-title">Backup &amp; Restore</p>
<div class="backup-row">
  <button class="backup-btn" onclick="saveBackup()">💾 Save Backup</button>
  <button class="backup-btn" onclick="document.getElementById('load-input').click()">📂 Load Backup</button>
</div>
<input type="file" id="load-input" accept=".json" onchange="loadBackup(event)">

<p class="refresh-note">Dates update automatically every time you open this page.</p>

<script>
// ── Your payment schedules (baked in) ──────────────────────────────
const SCHEDULES = [
  {
    id:    'pip',
    label: 'PIP',
    freq:  'Every 4 weeks',
    type:  'interval',
    anchor: '2025-06-18',   // last known payment
    days:   28,
  },
  {
    id:    'esa',
    label: 'ESA',
    freq:  'Every 2 weeks',
    type:  'interval',
    anchor: '2025-06-17',   // last known payment
    days:   14,
  },
  {
    id:   'uc',
    label: 'UC',
    freq:  'Monthly on the 12th',
    type:  'monthly',
    dayOfMonth: 12,
  },
];

// ── Date helpers ────────────────────────────────────────────────────

function today() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// Move a date back to Friday if it lands on Saturday or Sunday
function adjustForWeekend(d) {
  const day = d.getDay(); // 0=Sun, 6=Sat
  if (day === 6) { d.setDate(d.getDate() - 1); return { date: d, adjusted: true, reason: 'Saturday → paid Friday' }; }
  if (day === 0) { d.setDate(d.getDate() - 2); return { date: d, adjusted: true, reason: 'Sunday → paid Friday' }; }
  return { date: d, adjusted: false, reason: null };
}

function nextInterval(anchorStr, intervalDays) {
  const anchor = new Date(anchorStr);
  anchor.setHours(0, 0, 0, 0);
  const now = today();
  let next = new Date(anchor);
  while (next <= now) {
    next.setDate(next.getDate() + intervalDays);
  }
  return next;
}

function nextMonthly(dayOfMonth) {
  const now = today();
  let next = new Date(now.getFullYear(), now.getMonth(), dayOfMonth);
  if (next <= now) {
    next = new Date(now.getFullYear(), now.getMonth() + 1, dayOfMonth);
  }
  return next;
}

function calcNext(schedule) {
  let raw;
  if (schedule.type === 'interval') {
    raw = nextInterval(schedule.anchor, schedule.days);
  } else {
    raw = nextMonthly(schedule.dayOfMonth);
  }
  return adjustForWeekend(raw);
}

function formatDate(d) {
  return d.toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long'
  });
}

function daysUntil(d) {
  return Math.round((d - today()) / 86_400_000);
}

// ── Render ──────────────────────────────────────────────────────────

function render() {
  const now = new Date();
  document.getElementById('today-line').textContent =
    'Today is ' + now.toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

  const container = document.getElementById('cards');
  container.innerHTML = '';

  SCHEDULES.forEach(s => {
    const { date, adjusted, reason } = calcNext(s);
    const days = daysUntil(date);

    let pillClass, pillText;
    if (days === 0) {
      pillClass = 'today'; pillText = '🎉 Today!';
    } else if (days === 1) {
      pillClass = 'soon'; pillText = 'Tomorrow';
    } else if (days <= 5) {
      pillClass = 'soon'; pillText = `In ${days} days`;
    } else if (days <= 10) {
      pillClass = 'medium'; pillText = `In ${days} days`;
    } else {
      pillClass = 'far'; pillText = `In ${days} days`;
    }

    const weekendHTML = adjusted
      ? `<div class="weekend-note">⚠️ ${reason} — paid early to avoid the weekend</div>`
      : '';

    const card = document.createElement('div');
    card.className = `card ${s.id}`;
    card.innerHTML = `
      <div class="card-header">
        <span class="tag">${s.label}</span>
        <span class="freq-label">${s.freq}</span>
      </div>
      <div class="next-date">${formatDate(date)}</div>
      <span class="days-pill ${pillClass}">${pillText}</span>
      ${weekendHTML}
    `;
    container.appendChild(card);
  });
}

// ── Backup / Restore ────────────────────────────────────────────────
// Note: schedules are baked in, so backup/restore is provided in case
// you want to export your current view or share it.

function saveBackup() {
  const payload = {
    note: 'Benefits tracker backup',
    saved: new Date().toISOString(),
    schedules: SCHEDULES,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'benefits-backup.json';
  a.click();
}

function loadBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      JSON.parse(ev.target.result); // validate
      alert('Backup looks good! Your dates are already baked into this file, so nothing has changed — but keep this backup safe in case you ever need a new copy of the page.');
    } catch {
      alert('Could not read that file. Make sure it\'s a valid backup.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

render();
</script>
</body>
</html>
