<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Benefit Payments</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --border: #dbe3ef;
    --text: #273247;
    --muted: #6f7c91;

    --pip: #5f8fd8;
    --pip-soft: #eaf2fd;

    --esa: #4f9f84;
    --esa-soft: #e9f7f1;

    --uc: #c88548;
    --uc-soft: #fff3e8;

    --soon: #c86666;
    --soon-soft: #fdeeee;

    --today: #7b6fc4;
    --today-soft: #f0edff;

    --shadow: 0 10px 28px rgba(50, 69, 99, 0.08);
    --radius: 18px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(circle at top, #ffffff 0, #f4f7fb 42%, #eef3f9 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 30px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.55rem;
    font-weight: 700;
    margin-bottom: 5px;
    letter-spacing: -0.02em;
  }

  .today-line {
    font-size: 0.84rem;
    color: var(--muted);
    margin-bottom: 30px;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .card {
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
  }

  .card.pip::before { background: var(--pip); }
  .card.esa::before { background: var(--esa); }
  .card.uc::before  { background: var(--uc); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }

  .tag {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .pip .tag { background: var(--pip-soft); color: var(--pip); }
  .esa .tag { background: var(--esa-soft); color: var(--esa); }
  .uc  .tag { background: var(--uc-soft); color: var(--uc); }

  .freq-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
  }

  .amount {
    font-family: 'DM Mono', monospace;
    font-size: 1.05rem;
    font-weight: 500;
    margin-bottom: 10px;
  }

  .pip .amount { color: var(--pip); }
  .esa .amount { color: var(--esa); }
  .uc .amount  { color: var(--uc); }

  .next-date {
    font-family: 'DM Mono', monospace;
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-bottom: 9px;
    color: var(--text);
  }

  .days-pill {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 6px;
  }

  .days-pill.far {
    background: var(--esa-soft);
    color: var(--esa);
  }

  .days-pill.medium {
    background: var(--uc-soft);
    color: var(--uc);
  }

  .days-pill.soon {
    background: var(--soon-soft);
    color: var(--soon);
  }

  .days-pill.today {
    background: var(--today-soft);
    color: var(--today);
  }

  .weekend-note {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
    margin-top: 4px;
    line-height: 1.4;
  }

  .refresh-note {
    text-align: center;
    font-size: 0.74rem;
    color: var(--muted);
    margin-top: 28px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>My Benefit Payments</h1>
<p class="today-line" id="today-line"></p>

<div class="cards" id="cards"></div>

<p class="refresh-note">
  Dates recalculate automatically whenever you open this page.
  Weekend payments are moved to Friday; bank holidays may also affect payment dates.
</p>

<script>
const SCHEDULES = [
  {
    id: 'pip',
    label: 'PIP',
    freq: 'Every 4 weeks',
    amount: '£626.80',
    type: 'interval',
    anchor: [2026, 6, 18],
    days: 28,
  },
  {
    id: 'esa',
    label: 'ESA',
    freq: 'Every 2 weeks',
    amount: '£291.80',
    type: 'interval',
    anchor: [2026, 6, 17],
    days: 14,
  },
  {
    id: 'uc',
    label: 'UC',
    freq: 'Monthly on the 12th',
    amount: '£649.97',
    type: 'monthly',
    dayOfMonth: 12,
  },
];

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function anchorToDate(anchor) {
  const d = new Date(anchor[0], anchor[1] - 1, anchor[2]);
  d.setHours(0, 0, 0, 0);
  return d;
}

function addDays(date, numberOfDays) {
  const result = new Date(date);
  result.setDate(result.getDate() + numberOfDays);
  return result;
}

function adjustWeekend(date) {
  const day = date.getDay();

  if (day === 6) {
    return {
      date: addDays(date, -1),
      note: 'Falls on Saturday — paid Friday instead'
    };
  }

  if (day === 0) {
    return {
      date: addDays(date, -2),
      note: 'Falls on Sunday — paid Friday instead'
    };
  }

  return {
    date: new Date(date),
    note: null
  };
}

function calendarDayDifference(from, to) {
  const fromUTC = Date.UTC(
    from.getFullYear(),
    from.getMonth(),
    from.getDate()
  );

  const toUTC = Date.UTC(
    to.getFullYear(),
    to.getMonth(),
    to.getDate()
  );

  return Math.round((toUTC - fromUTC) / 86_400_000);
}

function nextInterval(anchor, intervalDays) {
  const today = startOfToday();
  let nominalDate = new Date(anchor);

  if (nominalDate < today) {
    const elapsedDays = calendarDayDifference(nominalDate, today);
    const jumps = Math.max(0, Math.floor(elapsedDays / intervalDays) - 1);
    nominalDate = addDays(nominalDate, jumps * intervalDays);
  }

  while (true) {
    const adjusted = adjustWeekend(nominalDate);

    if (adjusted.date >= today) {
      return adjusted;
    }

    nominalDate = addDays(nominalDate, intervalDays);
  }
}

function nextMonthly(dayOfMonth) {
  const today = startOfToday();
  let year = today.getFullYear();
  let month = today.getMonth();

  while (true) {
    const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
    const safeDay = Math.min(dayOfMonth, lastDayOfMonth);
    const nominalDate = new Date(year, month, safeDay);
    const adjusted = adjustWeekend(nominalDate);

    if (adjusted.date >= today) {
      return adjusted;
    }

    month += 1;

    if (month > 11) {
      month = 0;
      year += 1;
    }
  }
}

function calculateNextPayment(schedule) {
  if (schedule.type === 'interval') {
    return nextInterval(
      anchorToDate(schedule.anchor),
      schedule.days
    );
  }

  return nextMonthly(schedule.dayOfMonth);
}

function formatDate(date) {
  return date.toLocaleDateString('en-GB', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });
}

function daysUntil(date) {
  return calendarDayDifference(startOfToday(), date);
}

function render() {
  const now = new Date();

  document.getElementById('today-line').textContent =
    'Today is ' +
    now.toLocaleDateString('en-GB', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });

  const container = document.getElementById('cards');
  container.innerHTML = '';

  SCHEDULES.forEach(schedule => {
    const result = calculateNextPayment(schedule);
    const days = daysUntil(result.date);

    let pillClass;
    let pillText;

    if (days === 0) {
      pillClass = 'today';
      pillText = 'Today';
    } else if (days === 1) {
      pillClass = 'soon';
      pillText = 'Tomorrow';
    } else if (days <= 5) {
      pillClass = 'soon';
      pillText = `In ${days} days`;
    } else if (days <= 12) {
      pillClass = 'medium';
      pillText = `In ${days} days`;
    } else {
      pillClass = 'far';
      pillText = `In ${days} days`;
    }

    const card = document.createElement('div');
    card.className = `card ${schedule.id}`;

    card.innerHTML = `
      <div class="card-header">
        <span class="tag">${schedule.label}</span>
        <span class="freq-label">${schedule.freq}</span>
      </div>
      <div class="amount">${schedule.amount}</div>
      <div class="next-date">${formatDate(result.date)}</div>
      <span class="days-pill ${pillClass}">${pillText}</span>
      ${result.note
        ? `<div class="weekend-note">${result.note}</div>`
        : ''
      }
    `;

    container.appendChild(card);
  });
}

render();
</script>
</body>
</html>
