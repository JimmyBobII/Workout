<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exercise Timer</title>
<style>
  :root {
    --bg:#0e0e0e;
    --surface:#1a1a1a;
    --surface2:#242424;
    --border:#2e2e2e;
    --accent:#e8ff47;
    --blue:#47c8ff;
    --text:#f0f0f0;
    --muted:#888;
    --green:#73e2a7;
  }

  * {
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }

  body {
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
  }

  button, input {
    font:inherit;
  }

  #setup {
    max-width:480px;
    margin:0 auto;
    padding:24px 20px 60px;
  }

  h1 {
    margin-bottom:28px;
    color:var(--accent);
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:2.6rem;
    font-weight:400;
    letter-spacing:3px;
  }

  .card {
    margin-bottom:14px;
    padding:18px;
    border:1px solid var(--border);
    border-radius:16px;
    background:var(--surface);
  }

  .card-title {
    margin-bottom:14px;
    color:var(--muted);
    font-size:0.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }

  .row:last-child {
    border-bottom:none;
  }

  .row label {
    font-size:0.9rem;
  }

  .unit {
    margin-right:8px;
    color:var(--muted);
    font-size:0.75rem;
  }

  input[type=number] {
    width:68px;
    padding:5px 4px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:var(--surface2);
    color:var(--text);
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:1.35rem;
    text-align:center;
    -webkit-appearance:none;
    appearance:none;
  }

  input[type=number]:focus {
    border-color:var(--accent);
  }

  #totalPreview {
    margin-bottom:10px;
    padding:14px;
    color:var(--muted);
    font-size:0.8rem;
    letter-spacing:1px;
    text-align:center;
  }

  #previewTime {
    display:block;
    margin-top:3px;
    color:var(--text);
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:1.55rem;
    font-weight:400;
    letter-spacing:2px;
  }

  #startBtn {
    display:block;
    width:100%;
    padding:18px;
    border:0;
    border-radius:16px;
    background:var(--accent);
    color:#0e0e0e;
    cursor:pointer;
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:1.8rem;
    letter-spacing:3px;
  }

  .stats-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat {
    padding:12px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--surface2);
  }

  .stat-value {
    display:block;
    color:var(--text);
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:1.55rem;
    font-weight:400;
    letter-spacing:1px;
  }

  .stat-label {
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:0.67rem;
    letter-spacing:1px;
    line-height:1.3;
    text-transform:uppercase;
  }

  #historyList {
    margin-top:14px;
  }

  .history-row {
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:9px 0;
    border-top:1px solid var(--border);
    color:var(--muted);
    font-size:0.78rem;
  }

  .history-result {
    color:var(--text);
    font-weight:600;
    text-align:right;
  }

  .small-btn {
    width:100%;
    margin-top:12px;
    padding:11px;
    border:1px solid var(--border);
    border-radius:11px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:0.75rem;
  }

  #timer {
    display:none;
    min-height:100vh;
    padding:30px 20px;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  #phase {
    margin-bottom:12px;
    color:var(--muted);
    font-size:0.7rem;
    letter-spacing:3px;
    text-transform:uppercase;
  }

  #bigTime {
    color:var(--accent);
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:min(22vw, 8rem);
    font-weight:400;
    line-height:1;
  }

  #progLabel {
    min-height:1.4em;
    margin-top:18px;
    color:var(--text);
    font-size:1rem;
    font-weight:600;
  }

  #elapsedLabel {
    margin-top:6px;
    color:var(--muted);
    font-size:0.75rem;
    letter-spacing:1px;
  }

  #planStatus {
    min-height:1.4em;
    margin-top:10px;
    color:var(--green);
    font-size:0.8rem;
  }

  .bar-wrap {
    width:100%;
    max-width:340px;
    height:6px;
    margin-top:16px;
    overflow:hidden;
    border-radius:99px;
    background:var(--surface2);
  }

  #bar {
    width:100%;
    height:100%;
    border-radius:99px;
    background:var(--accent);
  }

  .controls,
  .set-controls {
    display:flex;
    width:100%;
    max-width:390px;
    gap:10px;
  }

  .controls {
    margin-top:30px;
  }

  .set-controls {
    margin-top:12px;
  }

  .ctrl-btn,
  .set-btn {
    flex:1;
    min-height:52px;
    padding:12px 8px;
    border-radius:14px;
    cursor:pointer;
    font-size:0.76rem;
    font-weight:700;
  }

  .ctrl-btn {
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
  }

  .set-btn {
    background:transparent;
  }

  .set-btn.add {
    border:1px solid rgba(115,226,167,0.65);
    color:var(--green);
  }

  .set-btn.last {
    border:1px solid rgba(71,200,255,0.65);
    color:var(--blue);
  }

  #doneScreen {
    display:none;
    min-height:100vh;
    padding:30px;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  #doneScreen h2 {
    color:var(--accent);
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:4rem;
    font-weight:400;
    letter-spacing:4px;
  }

  #doneScreen p {
    margin-top:10px;
    color:var(--muted);
  }

  #totalTime,
  #setsDone {
    margin-top:20px;
    color:var(--text);
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:2.2rem;
    font-weight:400;
    letter-spacing:2px;
  }

  #setsDone {
    margin-top:17px;
    color:var(--blue);
    font-size:1.8rem;
  }

  .result-label {
    margin-top:4px;
    color:var(--muted);
    font-size:0.65rem;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  #recordNote {
    min-height:1.4em;
    margin-top:16px;
    color:var(--green);
    font-size:0.85rem;
  }

  #againBtn {
    margin-top:28px;
    padding:16px 40px;
    border:0;
    border-radius:14px;
    background:var(--accent);
    color:#0e0e0e;
    cursor:pointer;
    font-family:Impact, "Arial Narrow", sans-serif;
    font-size:1.5rem;
    letter-spacing:2px;
  }

  @media (max-width:390px) {
    .ctrl-btn, .set-btn {
      font-size:0.68rem;
      padding:11px 5px;
    }
  }
</style>
</head>
<body>

<div id="setup">
  <h1>TIMER</h1>

  <div class="card">
    <div class="card-title">Warmup</div>
    <div class="row">
      <label for="warmup">Duration</label>
      <div><span class="unit">sec</span><input type="number" id="warmup" value="60" min="0" oninput="updatePreview()"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Exercises</div>
    <div class="row">
      <label for="exCount">Exercises per set</label>
      <div><input type="number" id="exCount" value="5" min="1" oninput="updatePreview()"></div>
    </div>
    <div class="row">
      <label for="exTime">Work time</label>
      <div><span class="unit">sec</span><input type="number" id="exTime" value="40" min="1" oninput="updatePreview()"></div>
    </div>
    <div class="row">
      <label for="exRest">Rest between exercises</label>
      <div><span class="unit">sec</span><input type="number" id="exRest" value="15" min="0" oninput="updatePreview()"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Sets</div>
    <div class="row">
      <label for="sets">Number of sets</label>
      <div><input type="number" id="sets" value="3" min="1" oninput="updatePreview()"></div>
    </div>
    <div class="row">
      <label for="setCooldown">Cooldown between sets</label>
      <div><span class="unit">sec</span><input type="number" id="setCooldown" value="60" min="0" oninput="updatePreview()"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Finish</div>
    <div class="row">
      <label for="finalCooldown">Final cooldown</label>
      <div><span class="unit">sec</span><input type="number" id="finalCooldown" value="120" min="0" oninput="updatePreview()"></div>
    </div>
  </div>

  <div id="totalPreview">
    TOTAL WORKOUT TIME
    <strong id="previewTime">18:00</strong>
  </div>

  <button id="startBtn" type="button" onclick="startWorkout()">START</button>

  <div class="card" style="margin-top:18px">
    <div class="card-title">Records on this device</div>

    <div class="stats-grid">
      <div class="stat">
        <span class="stat-value" id="completedStat">0</span>
        <span class="stat-label">Completed workouts</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="daysStat">0</span>
        <span class="stat-label">Workout days</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="longestStat">00:00</span>
        <span class="stat-label">Longest workout</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="setsStat">0</span>
        <span class="stat-label">Most sets</span>
      </div>
    </div>

    <div id="historyList">
      <div class="history-row"><span>Completed workouts will appear here.</span></div>
    </div>

    <button class="small-btn" type="button" onclick="clearHistory()">CLEAR RECORDS</button>
  </div>
</div>

<div id="timer">
  <div id="phase">WARMUP</div>
  <div id="bigTime">0</div>
  <div id="progLabel"></div>
  <div id="elapsedLabel">Elapsed: 00:00</div>
  <div id="planStatus"></div>

  <div class="bar-wrap"><div id="bar"></div></div>

  <div class="controls">
    <button class="ctrl-btn" type="button" id="pauseBtn" onclick="togglePause()">PAUSE</button>
    <button class="ctrl-btn" type="button" onclick="skipPhase()">SKIP</button>
    <button class="ctrl-btn" type="button" onclick="stopWorkout()">STOP</button>
  </div>

  <div class="set-controls">
    <button class="set-btn add" type="button" onclick="addOneSet()">+ ADD ONE SET</button>
    <button class="set-btn last" type="button" onclick="makeCurrentSetLast()">CURRENT SET IS LAST</button>
  </div>
</div>

<div id="doneScreen">
  <h2>DONE!</h2>
  <p>Great work</p>

  <div id="totalTime">00:00</div>
  <div class="result-label">Total time</div>

  <div id="setsDone">0</div>
  <div class="result-label">Sets completed</div>

  <div id="recordNote"></div>

  <button id="againBtn" type="button" onclick="showSetup()">AGAIN</button>
</div>

<script>
var HISTORY_KEY = "exercise-timer-history-v2";

var phases = [];
var phaseIndex = 0;
var remaining = 0;
var phaseDuration = 0;
var phaseTimer = null;
var elapsedTimer = null;
var nextPhaseTimer = null;
var statusTimer = null;
var paused = false;
var elapsedSeconds = 0;
var completedSets = 0;
var totalSets = 0;
var settings = null;
var memoryHistory = [];

function getNumber(id, fallback) {
  var value = parseInt(document.getElementById(id).value, 10);
  if (isNaN(value)) {
    return fallback;
  }
  return value;
}

function readSettings() {
  return {
    warmup: Math.max(0, getNumber("warmup", 0)),
    exerciseCount: Math.max(1, getNumber("exCount", 1)),
    exerciseTime: Math.max(1, getNumber("exTime", 1)),
    exerciseRest: Math.max(0, getNumber("exRest", 0)),
    sets: Math.max(1, getNumber("sets", 1)),
    setCooldown: Math.max(0, getNumber("setCooldown", 0)),
    finalCooldown: Math.max(0, getNumber("finalCooldown", 0))
  };
}

function twoDigits(value) {
  return value < 10 ? "0" + value : String(value);
}

function formatElapsed(seconds) {
  var safe = Math.max(0, Math.round(seconds));
  var hours = Math.floor(safe / 3600);
  var minutes = Math.floor((safe % 3600) / 60);
  var secs = safe % 60;

  if (hours > 0) {
    return hours + ":" + twoDigits(minutes) + ":" + twoDigits(secs);
  }

  return twoDigits(minutes) + ":" + twoDigits(secs);
}

function formatTimer(seconds) {
  var safe = Math.max(0, Math.round(seconds));
  var minutes = Math.floor(safe / 60);
  var secs = safe % 60;

  if (minutes > 0) {
    return minutes + ":" + twoDigits(secs);
  }

  return String(secs);
}

function calculateTotal() {
  var s = readSettings();
  var oneSet = (s.exerciseCount * s.exerciseTime) +
    ((s.exerciseCount - 1) * s.exerciseRest);

  return s.warmup +
    (s.sets * oneSet) +
    ((s.sets - 1) * s.setCooldown) +
    s.finalCooldown;
}

function updatePreview() {
  var preview = document.getElementById("previewTime");
  if (preview) {
    preview.innerHTML = formatElapsed(calculateTotal());
  }
}

function makeSetPhases(setNumber) {
  var list = [];
  var exercise;

  for (exercise = 1; exercise <= settings.exerciseCount; exercise += 1) {
    list.push({
      type: "work",
      label: "WORK",
      duration: settings.exerciseTime,
      color: "var(--accent)",
      setNumber: setNumber,
      exerciseNumber: exercise
    });

    if (exercise < settings.exerciseCount && settings.exerciseRest > 0) {
      list.push({
        type: "exerciseRest",
        label: "REST",
        duration: settings.exerciseRest,
        color: "var(--blue)",
        setNumber: setNumber,
        exerciseNumber: exercise
      });
    }
  }

  return list;
}

function makeSetCooldown(setNumber) {
  return {
    type: "setCooldown",
    label: "SET " + setNumber + " COOLDOWN",
    duration: settings.setCooldown,
    color: "var(--blue)",
    setNumber: setNumber
  };
}

function makeFinalCooldown() {
  return {
    type: "finalCooldown",
    label: "FINAL COOLDOWN",
    duration: settings.finalCooldown,
    color: "var(--blue)"
  };
}

function buildPhases() {
  var list = [];
  var setNumber;
  var setParts;
  var i;

  if (settings.warmup > 0) {
    list.push({
      type: "warmup",
      label: "WARMUP",
      duration: settings.warmup,
      color: "var(--blue)"
    });
  }

  for (setNumber = 1; setNumber <= totalSets; setNumber += 1) {
    setParts = makeSetPhases(setNumber);

    for (i = 0; i < setParts.length; i += 1) {
      list.push(setParts[i]);
    }

    if (setNumber < totalSets && settings.setCooldown > 0) {
      list.push(makeSetCooldown(setNumber));
    }
  }

  if (settings.finalCooldown > 0) {
    list.push(makeFinalCooldown());
  }

  return list;
}

function getProgressText(phase) {
  if (phase.type === "warmup") {
    return "Preparing for " + totalSets + (totalSets === 1 ? " set" : " sets");
  }

  if (phase.type === "work") {
    return "Set " + phase.setNumber + " of " + totalSets +
      "  ·  Exercise " + phase.exerciseNumber + " of " + settings.exerciseCount;
  }

  if (phase.type === "exerciseRest") {
    return "Set " + phase.setNumber + " of " + totalSets +
      "  ·  After exercise " + phase.exerciseNumber;
  }

  if (phase.type === "setCooldown") {
    return "Set " + phase.setNumber + " of " + totalSets + " complete";
  }

  return "All " + totalSets + (totalSets === 1 ? " set complete" : " sets complete");
}

function startWorkout() {
  settings = readSettings();
  totalSets = settings.sets;
  phases = buildPhases();

  if (phases.length === 0) {
    return;
  }

  clearAllTimers();

  document.getElementById("setup").style.display = "none";
  document.getElementById("doneScreen").style.display = "none";
  document.getElementById("timer").style.display = "flex";

  phaseIndex = 0;
  elapsedSeconds = 0;
  completedSets = 0;
  paused = false;

  document.getElementById("pauseBtn").innerHTML = "PAUSE";
  document.getElementById("planStatus").innerHTML = "";
  updateElapsed();
  loadPhase();

  elapsedTimer = setInterval(function () {
    if (!paused) {
      elapsedSeconds += 1;
      updateElapsed();
    }
  }, 1000);
}

function loadPhase() {
  var phase;

  clearInterval(phaseTimer);
  clearTimeout(nextPhaseTimer);

  if (phaseIndex >= phases.length) {
    finishWorkout();
    return;
  }

  phase = phases[phaseIndex];
  remaining = phase.duration;
  phaseDuration = phase.duration;

  document.getElementById("phase").innerHTML = phase.label;
  document.getElementById("bigTime").style.color = phase.color;
  document.getElementById("bar").style.background = phase.color;
  document.getElementById("progLabel").innerHTML = getProgressText(phase);

  updateDisplay();
  playStartSound();

  phaseTimer = setInterval(function () {
    if (!paused) {
      tick();
    }
  }, 1000);
}

function tick() {
  if (remaining <= 3 && remaining > 0) {
    playTickSound();
  }

  remaining -= 1;
  updateDisplay();

  if (remaining <= 0) {
    completePhase();
  }
}

function completePhase() {
  var phase = phases[phaseIndex];

  clearInterval(phaseTimer);

  if (
    phase &&
    phase.type === "work" &&
    phase.exerciseNumber === settings.exerciseCount
  ) {
    completedSets = Math.max(completedSets, phase.setNumber);
  }

  playEndSound();
  phaseIndex += 1;

  nextPhaseTimer = setTimeout(function () {
    loadPhase();
  }, 400);
}

function updateDisplay() {
  var shown = Math.max(0, remaining);
  var percentage = phaseDuration > 0 ? (shown / phaseDuration) * 100 : 0;

  document.getElementById("bigTime").innerHTML = formatTimer(shown);
  document.getElementById("bar").style.width = percentage + "%";
}

function updateElapsed() {
  document.getElementById("elapsedLabel").innerHTML =
    "Elapsed: " + formatElapsed(elapsedSeconds);
}

function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").innerHTML = paused ? "RESUME" : "PAUSE";
}

function skipPhase() {
  clearTimeout(nextPhaseTimer);
  completePhase();
}

function currentSetNumber() {
  var phase = phases[phaseIndex];

  if (!phase) {
    return totalSets;
  }

  if (phase.type === "warmup") {
    return 1;
  }

  if (phase.type === "finalCooldown") {
    return totalSets;
  }

  return phase.setNumber || totalSets;
}

function refreshCurrentProgress() {
  var phase = phases[phaseIndex];

  if (phase) {
    document.getElementById("progLabel").innerHTML = getProgressText(phase);
  }
}

function showStatus(message) {
  clearTimeout(statusTimer);
  document.getElementById("planStatus").innerHTML = message;

  statusTimer = setTimeout(function () {
    document.getElementById("planStatus").innerHTML = "";
  }, 4500);
}

function insertArrayAt(array, index, items) {
  var args = [index, 0];
  var i;

  for (i = 0; i < items.length; i += 1) {
    args.push(items[i]);
  }

  Array.prototype.splice.apply(array, args);
}

function addOneSet() {
  var oldTotal;
  var newSet;
  var current;
  var insertAt;
  var additions = [];
  var setParts;
  var i;

  if (!settings || !phases[phaseIndex]) {
    return;
  }

  oldTotal = totalSets;
  newSet = oldTotal + 1;
  totalSets = newSet;
  document.getElementById("sets").value = String(totalSets);
  current = phases[phaseIndex];

  if (current.type === "finalCooldown") {
    if (settings.setCooldown > 0) {
      additions.push(makeSetCooldown(oldTotal));
    }

    setParts = makeSetPhases(newSet);
    for (i = 0; i < setParts.length; i += 1) {
      additions.push(setParts[i]);
    }

    if (settings.finalCooldown > 0) {
      additions.push(makeFinalCooldown());
    }

    phases.splice(phaseIndex, phases.length - phaseIndex);
    insertArrayAt(phases, phaseIndex, additions);
    showStatus("Set " + newSet + " added.");
    loadPhase();
    return;
  }

  insertAt = phases.length;

  for (i = phaseIndex + 1; i < phases.length; i += 1) {
    if (phases[i].type === "finalCooldown") {
      insertAt = i;
      break;
    }
  }

  if (settings.setCooldown > 0) {
    additions.push(makeSetCooldown(oldTotal));
  }

  setParts = makeSetPhases(newSet);
  for (i =
