<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Little Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8F1;
    --blush:#FFE1E9;
    --blush-deep:#FFD0DE;
    --sky:#DCEEFF;
    --lavender:#EAE0FB;
    --cocoa:#6B5251;
    --cocoa-soft:#9C8281;
    --strawberry:#FF8FA8;
    --strawberry-deep:#FF6F92;
    --mint:#C9EAD4;
    --shadow: 0 6px 18px rgba(107,82,81,0.12);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.6) 0, transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(255,255,255,0.5) 0, transparent 40%),
      var(--cream);
    font-family:'Quicksand', sans-serif;
    color:var(--cocoa);
    -webkit-tap-highlight-color: transparent;
  }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }

  header{
    padding:22px 20px 16px;
    text-align:center;
    position:relative;
  }

  header h1{
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:1.55rem;
    margin:0;
    color:var(--strawberry-deep);
    letter-spacing:0.3px;
  }

  header .sub{
    font-size:0.85rem;
    color:var(--cocoa-soft);
    margin-top:4px;
  }

  .bow-corner{
    position:absolute;
    top:14px;
    right:16px;
    width:34px;
    height:34px;
    opacity:0.85;
  }
  .bow-corner-left{
    position:absolute;
    top:14px;
    left:16px;
    width:30px;
    height:30px;
    opacity:0.6;
    transform:rotate(-12deg);
  }

  nav{
    display:flex;
    gap:8px;
    padding:0 20px 14px;
  }
  nav button{
    flex:1;
    border:none;
    padding:10px 8px;
    border-radius:999px;
    font-family:'Baloo 2', cursive;
    font-size:0.95rem;
    font-weight:600;
    background:var(--blush);
    color:var(--strawberry-deep);
    cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  nav button.active{
    background:var(--strawberry);
    color:white;
    box-shadow:var(--shadow);
  }
  nav button:active{ transform:scale(0.96); }

  main{
    flex:1;
    padding:0 20px 28px;
    position:relative;
  }

  .view{ display:none; animation:fadeIn .25s ease; }
  .view.active{ display:block; }

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .date-display{
    font-family:'Baloo 2', cursive;
    font-size:1.15rem;
    font-weight:600;
    color:var(--cocoa);
    margin-bottom:2px;
  }
  .date-sub{
    font-size:0.8rem;
    color:var(--cocoa-soft);
    margin-bottom:14px;
  }

  .paper{
    background:
      linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2)),
      var(--blush);
    border-radius:22px;
    padding:16px 14px 18px;
    box-shadow:var(--shadow);
    position:relative;
  }

  .paper::before{
    content:"";
    position:absolute;
    top:-8px; left:24px;
    width:36px; height:16px;
    background:var(--mint);
    border-radius:0 0 8px 8px;
    box-shadow:var(--shadow);
  }

  textarea{
    width:100%;
    min-height:38vh;
    resize:vertical;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Quicksand', sans-serif;
    font-size:1.02rem;
    line-height:1.55;
    color:var(--cocoa);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 33px,
      rgba(107,82,81,0.10) 34px
    );
    line-height:34px;
    padding-top:2px;
  }
  textarea::placeholder{ color:#c8a9ab; }

  .save-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
  }

  .save-btn{
    flex:1;
    border:none;
    padding:13px;
    border-radius:16px;
    background:var(--strawberry);
    color:white;
    font-family:'Baloo 2', cursive;
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s ease;
  }
  .save-btn:active{ transform:scale(0.97); }

  .saved-note{
    text-align:center;
    font-size:0.82rem;
    color:var(--cocoa-soft);
    margin-top:10px;
    min-height:1.1em;
  }

  .entry-card{
    background:var(--sky);
    border-radius:18px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .entry-card .info{ flex:1; cursor:pointer; }
  .entry-card .info .d{
    font-family:'Baloo 2', cursive;
    font-weight:600;
    font-size:0.98rem;
    color:var(--cocoa);
  }
  .entry-card .info .preview{
    font-size:0.85rem;
    color:var(--cocoa-soft);
    margin-top:4px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .entry-card .del{
    border:none;
    background:transparent;
    color:var(--strawberry-deep);
    font-size:1.1rem;
    cursor:pointer;
    padding:4px 6px;
    opacity:0.6;
  }
  .entry-card .del:active{ opacity:1; }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--cocoa-soft);
  }
  .empty-state .icon{ font-size:2rem; margin-bottom:8px; }

  .backup-card{
    background:var(--lavender);
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .backup-card h3{
    font-family:'Baloo 2', cursive;
    margin:0 0 6px;
    font-size:1.05rem;
  }
  .backup-card p{
    font-size:0.87rem;
    color:var(--cocoa-soft);
    margin:0 0 14px;
    line-height:1.4;
  }
  .backup-btn{
    width:100%;
    border:none;
    padding:12px;
    border-radius:14px;
    background:white;
    color:var(--strawberry-deep);
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:0.98rem;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(107,82,81,0.10);
  }
  .backup-btn:active{ transform:scale(0.98); }
  input[type=file]{ display:none; }

  #sealOverlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:50;
  }
  #sealOverlay svg{
    width:110px;
    height:110px;
    opacity:0;
    transform:scale(0.3) rotate(-25deg);
  }
  #sealOverlay.show svg{
    animation:sealPop .7s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes sealPop{
    0%{ opacity:0; transform:scale(0.2) rotate(-35deg); }
    60%{ opacity:1; transform:scale(1.08) rotate(4deg); }
    100%{ opacity:0; transform:scale(1) rotate(0deg); }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <svg class="bow-corner" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 32c-6-10-20-14-26-6-5 7 2 16 12 16 6 0 11-4 14-10z" fill="#FF8FA8"/>
      <path d="M32 32c6-10 20-14 26-6 5 7-2 16-12 16-6 0-11-4-14-10z" fill="#FF6F92"/>
      <circle cx="32" cy="32" r="5" fill="#FFF8F1"/>
    </svg>
    <svg class="bow-corner-left" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 32c-6-10-20-14-26-6-5 7 2 16 12 16 6 0 11-4 14-10z" fill="#C9EAD4"/>
      <path d="M32 32c6-10 20-14 26-6 5 7-2 16-12 16-6 0-11-4-14-10z" fill="#AEDFC1"/>
      <circle cx="32" cy="32" r="5" fill="#FFF8F1"/>
    </svg>
    <h1>My Little Journal</h1>
    <div class="sub">a soft place to write things down</div>
  </header>

  <nav>
    <button id="tabWrite" class="active" onclick="switchView('write')">✏️ Write</button>
    <button id="tabPast" onclick="switchView('past')">📖 Past</button>
    <button id="tabBackup" onclick="switchView('backup')">💾 Backup</button>
  </nav>

  <main>

    <section id="view-write" class="view active">
      <div class="date-display" id="dateDisplay"></div>
      <div class="date-sub" id="dateSub"></div>
      <div class="paper">
        <textarea id="entryText" placeholder="Dear diary..."></textarea>
        <div class="save-row">
          <button class="save-btn" onclick="saveCurrentEntry()">🎀 Save entry</button>
        </div>
        <div class="saved-note" id="savedNote"></div>
      </div>
    </section>

    <section id="view-past" class="view">
      <div id="entryList"></div>
    </section>

    <section id="view-backup" class="view">
      <div class="backup-card">
        <h3>🍓 Save a backup</h3>
        <p>Downloads all your entries as one file, in case your browser ever loses them.</p>
        <button class="backup-btn" onclick="exportBackup()">Export backup file</button>
      </div>
      <div class="backup-card">
        <h3>🌸 Load a backup</h3>
        <p>Choose a backup file you saved before to bring your entries back.</p>
        <button class="backup-btn" onclick="document.getElementById('importFile').click()">Import backup file</button>
        <input type="file" id="importFile" accept="application/json" onchange="importBackup(event)">
      </div>
    </section>

  </main>

  <div id="sealOverlay">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 32c-8-13-26-18-33-8-6 9 2 20 15 20 8 0 14-5 18-12z" fill="#FF8FA8"/>
      <path d="M32 32c8-13 26-18 33-8 6 9-2 20-15 20-8 0-14-5-18-12z" fill="#FF6F92"/>
      <circle cx="32" cy="32" r="7" fill="#FFF8F1"/>
      <circle cx="32" cy="32" r="4" fill="#FF6F92"/>
    </svg>
  </div>

</div>

<script>
  const STORAGE_KEY = 'sanrio_journal_entries_v1';
  let currentDate = todayKey();

  function todayKey(d = new Date()){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function loadEntries(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      return {};
    }
  }

  function saveEntries(entries){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function formatDateNice(key){
    const [y,m,d] = key.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }

  function switchView(name){
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('view-'+name).classList.add('active');
    document.getElementById('tab'+name.charAt(0).toUpperCase()+name.slice(1)).classList.add('active');
    if(name === 'past') renderList();
    if(name === 'write') loadIntoWriteView(currentDate);
  }

  function loadIntoWriteView(dateKey){
    currentDate = dateKey;
    const entries = loadEntries();
    document.getElementById('dateDisplay').textContent = formatDateNice(dateKey);
    const isToday = dateKey === todayKey();
    document.getElementById('dateSub').textContent = isToday ? "today" : "editing a past entry";
    document.getElementById('entryText').value = (entries[dateKey] && entries[dateKey].text) || '';
    document.getElementById('savedNote').textContent = entries[dateKey]
      ? 'last saved ' + new Date(entries[dateKey].updatedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
      : '';
  }

  function saveCurrentEntry(){
    const text = document.getElementById('entryText').value;
    const entries = loadEntries();
    if(text.trim() === ''){
      delete entries[currentDate];
    } else {
      entries[currentDate] = { text, updatedAt: new Date().toISOString() };
    }
    saveEntries(entries);
    document.getElementById('savedNote').textContent = 'saved just now ♡';
    playSeal();
  }

  function playSeal(){
    const overlay = document.getElementById('sealOverlay');
    overlay.classList.remove('show');
    void overlay.offsetWidth;
    overlay.classList.add('show');
    setTimeout(() => overlay.classList.remove('show'), 750);
  }

  function renderList(){
    const entries = loadEntries();
    const keys = Object.keys(entries).sort().reverse();
    const list = document.getElementById('entryList');
    if(keys.length === 0){
      list.innerHTML = `<div class="empty-state"><div class="icon">🌷</div>No entries yet — go write your first one!</div>`;
      return;
    }
    list.innerHTML = keys.map(k => {
      const preview = (entries[k].text || '').replace(/</g,'&lt;');
      return `
        <div class="entry-card">
          <div class="info" onclick="openEntry('${k}')">
            <div class="d">${formatDateNice(k)}</div>
            <div class="preview">${preview || '(empty)'}</div>
          </div>
          <button class="del" onclick="deleteEntry('${k}')">🗑️</button>
        </div>
      `;
    }).join('');
  }

  function openEntry(key){
    switchView('write');
    loadIntoWriteView(key);
  }

  function deleteEntry(key){
    if(!confirm('Delete this entry? This cannot be undone.')) return;
    const entries = loadEntries();
    delete entries[key];
    saveEntries(entries);
    renderList();
  }

  function exportBackup(){
    const entries = loadEntries();
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `journal-backup-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importBackup(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const imported = JSON.parse(e.target.result);
        const current = loadEntries();
        const merged = { ...current, ...imported };
        saveEntries(merged);
        alert('Backup loaded! Your entries are back. 🎀');
        renderList();
      }catch(err){
        alert("Hmm, that file couldn't be read. Please make sure it's a journal backup file.");
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  loadIntoWriteView(currentDate);
</script>
</body>
</html>
